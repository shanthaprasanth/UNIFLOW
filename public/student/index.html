<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Status - uniflow</title>
<link rel="stylesheet" href="/shared/style.css">
</head>
<body>
  <div class="topbar">
    <a href="/index.html">&larr; uniflow</a>
    <span>Student Status</span>
  </div>
  <div class="container">
    <h1>Student Status</h1>
    <div class="card" id="statusCard">Loading...</div>
  </div>

  <script src="/shared/auth.js"></script>
  <script>
    Kahe.requireLogin();

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }

    (async function init() {
      try {
        const { status } = await Kahe.api('/api/student/status');
        document.getElementById('statusCard').innerHTML = `
          <h2>Attendance</h2>
          <p>${escapeHtml(status.attendance_pct)}%</p>
          <h2>Fee Status</h2>
          <p>${escapeHtml(status.fee_status)}</p>
          <h2>Library Books Due</h2>
          <p>${escapeHtml(status.library_books_due)}</p>
        `;
      } catch (err) {
        const errorEl = document.createElement('span');
        errorEl.className = 'error';
        errorEl.textContent = err.message;
        document.getElementById('statusCard').replaceChildren(errorEl);
      }
    })();
  </script>
</body>
</html>
